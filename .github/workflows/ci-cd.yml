name: Wine Article CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # 唯一的门禁任务：lint + 数据校验 + 测试
  #
  # 本项目的实际运行形态是「本机桌面工具」（内容渲染 + 发布到公众号）。
  # 第一代新闻聚合流水线（crawler → aggregator → generator → publisher）
  # 及其容器化部署已整体归档到 archive/first-gen/，不再参与 CI。
  # 因此这里只保留 test 一个门禁，其余一律不跑，避免无谓的红灯淹没真实信号。
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 注：fix 规则早已在本地修净（0 error），此处作为回归门禁保留
      - name: Run linter
        run: npm run lint

      # 校验 articles/ 下全部文章数据（不依赖被 gitignore 的 output/，CI 可独立运行）
      - name: Validate article data
        run: npm run engine:check

      # 用 --coverage 一次跑完测试并生成 coverage/lcov.info，供下方 codecov 使用
      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        continue-on-error: true   # 未配置 CODECOV_TOKEN 时为提示性步骤，不阻塞 CI
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # ==========================================================================
  # 汇总提示（仅打印结论，不做任何外部副作用）
  # ==========================================================================
  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "test   : ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::测试未通过，请先修复 test 任务"
            exit 1
          fi
          echo "✅ 门禁通过"
